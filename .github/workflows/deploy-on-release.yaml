name: Generate JAR on Release

on:
  workflow_dispatch:
  release:
    types:
      - edited
      - published

jobs:

  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw clean package -P prod
          ls -als

      - name: Upload
        run: |
          if [[ "${{github.event_name}}" == "workflow_dispatch_2" ]]; then
            echo "Workflow is run manually. No need to upload release assests."
          elif [[ "${{github.event_name}}" == "workflow_dispatch" ]]; then
            echo "Workflow run on release event. Upload to release assets."
            
            echo "=======Calling Release Info======="
            curl --location --request GET "https://api.github.com/repos/${{github.repository}}/releases/305133412"\
              --verbose --output resp.txt
            
            cleanUrl=$(jq -r ".upload_url" resp.txt | { read url; echo "${url%\{*}"; })
            echo "=======Uploading JAR Asset======="
            for file in ./target/*.jar do
              echo "For $file ..."
            done
            
          fi
          
