name: Generate JAR on Release

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:

  build-jar:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw clean package -P prod

      - name: Upload
        run: |
          ls -als target
          echo "Event"
          echo "${{github.event}}"
          echo "Event Name"
          echo "${{github.event_name}}"
