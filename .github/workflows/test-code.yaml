name: Test Code

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - "development_automate"

jobs:

  test-code:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if branch updated
        run: |
          if ( git merge-base origin/master origin/developement_automate ); then
            echo "Branch is updated."
          
          else
            echo "Branch is not updated."
            exit 1
          
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Clean, Complie & Test Code
        run: |
          chmod +x mvnw
          ./mvnw clean test --activate-profiles release,!dev
