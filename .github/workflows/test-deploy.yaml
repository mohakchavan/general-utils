# This workflow file is used only for testing of workflows.
#
# DO NOT SUBMIT CHANGES FOR THIS FILE.
name: Test Deploy

on:
  workflow_dispatch:

jobs:

  test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

      - name: Checkout
        if: false
        uses: actions/checkout@v6

      - name: Setup Java
        if: false
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Show Settings
        if: false
        run: |
          cat ~/.m2/settings.xml

      - name: Build
        shell: sh
        run: |
          echo "${{ secrets.TEST_SECRET }}" | base64 --decode > resp2.txt
          echo "Decoded"
          cat resp2.txt

