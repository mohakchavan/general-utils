name: Test Deploy

on:
  workflow_dispatch:

jobs:

  test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Show Settings
        run: |
          cat ~/.m2/settings.xml

      - name: Build
        run: |
          base64 --decode ${{ secrets.TEST_SECRET }} > resp2.txt
          echo "Decoded"
          cat resp2.txt

